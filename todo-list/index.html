<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&family=Comfortaa&family=Caveat&family=Poppins&family=Baloo+2&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
</head>

<body>
    <h1>₊✩‧₊˚౨ To-Do List- 22/06/2025 ৎ˚₊✩‧₊</h1>
    <p class="emoji">🎀</p>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="assignment">
            <label for="assignment">Finish my assignment</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://andrewt0301.github.io/hse-acos-course/part2os/01_OS_Architecture/OS_Lecture_01.pdf" target="_blank">Lecture Presentation</a>

            </ul>

        <li>
            <input type="checkbox" id="vet">
            <label for="vet">Book annual check-up/vaccine for my bunnies</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.vets4pets.com/pet-health-advice/rabbit-advice/rabbit-vaccinations/" target="_blank">Booking Website</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="cookies">
            <label for="cookies">Bake some eggless cookies for my friend</label>
            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.how-tasty.com/eggless-chocolate-chip-cookies/" target="_blank">Chocolate Chip Cookie Recipe</a>
                </li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="workout">
            <label for="workout">Workout (running)</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.nike.com/gb/running/marathon-training-plan" target="_blank">Marathon Training Plan</a>
                </li>
            </ul>
        </li>
    </ul>
</body>

</html>
