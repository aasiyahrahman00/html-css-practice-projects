<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
</head>

<body>
  <div class="container">
    <h1>Job Application Form</h1>
    <form id="job-form">

      <label for="name" id="name-label">Full Name: </label>
      <input type="text" id="name" name="name" required placeholder="Enter your name here">

      <label for="email" id="email-label">Email: </label>
      <input type="email" id="email" name="email" required placeholder="Enter your email here"> 

      <label for="position">Position: </label>
      <select id="position" name="job-position" required>
        <option value="developer">Developer</option>
        <option value="designer">Designer</option>
        <option value="manager">Manager</option>
      </select>

      <fieldset class="radio-group">
        <legend>Availability</legend>

        <input type="radio" name="availability" id="full" value="full-time" required>
        <label for="full">Full Time</label>

        <input type="radio" name="availability" id="part" value="part-time" required>
        <label for="part">Part Time</label>
      </fieldset>

      <label for="message">Why do you want this job?</label>
      <textarea id="message" name="motivation-for-job" rows="10" cols="20" placeholder="Write your motivation here..."></textarea>

      <button type="submit">Submit</button>

    </form>
  </div>
</body>
</html>
